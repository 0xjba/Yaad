[package]
name = "yaad"
version = "0.1.0"
description = "The Voice-Powered Memory Vault for macOS"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
# REQUIRED: This allows build.rs to access 'SwiftLinker'
swift-rs = "1.0.7"

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-positioner = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- New Dependencies for "The Eyes" ---
swift-rs = "1.0.7"  # For runtime types (SRString, etc.)
image = "0.25.5"    # For handling screenshots
base64 = "0.22"     # For encoding images to send to frontend
ort = { version = "2.0.0-rc.9", features = ["coreml", "half"] } # CLIP and OCR models
anyhow = "1.0"      # Error handling
regex = "1.11"      # Regex for intent scoring
# ---------------------------------------

# The Database
rusqlite = { version = "0.31", features = ["bundled", "uuid", "modern_sqlite"] }
# Vector Search
sqlite-vec = "0.1.7-alpha.2"
# Embeddings (CPU)
fastembed = "4"
# Transcription
whisper-rs = { version = "0.13", features = ["metal"] }
# Audio capture
cpal = "0.15"
# Audio resampling
rubato = "0.14"
# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }
# HTTP client
reqwest = { version = "0.11", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
bytemuck = "1.14"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-fs = "2.0"
once_cell = "1.19"

[features]
custom-protocol = ["tauri/custom-protocol"]
